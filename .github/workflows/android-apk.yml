
name: Build ZG Memory Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZG_Memory_Android_Source.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: |
          mkdir android-project
          unzip ZG_Memory_Android_Source.zip -d android-project

      - name: Build APK
        working-directory: android-project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZG-Memory-Android-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
